site_name: ESPHome External Components
site_description: Collection of external ESPHome components and documentation
site_author: retsamedoc

theme:
  name: material
  palette:
    primary: blue
    accent: indigo
  font: Roboto
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.expand
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Components:
      - Roomba:
          - Overview: components/roomba/index.md
          - Getting Started: components/roomba/getting-started.md
          - Configuration: components/roomba/config.md
          - Sensors: components/roomba/sensors.md
          - Compatibility: components/roomba/compatibility.md
          - Troubleshooting: components/roomba/troubleshooting.md
          - Architecture:
              - Overview: components/roomba/architecture.md
          - Source Code Reference: 
            - roomba/index.md
            - Links: roomba/links.md
            - Classes:
              - Class List: roomba/annotated.md
              - Class Index: roomba/classes.md
              - Class Hierarchy: roomba/hierarchy.md
              - Class Members: roomba/class_members.md
              - Class Member Functions: roomba/class_member_functions.md
              - Class Member Variables: roomba/class_member_variables.md
              - Class Member Typedefs: roomba/class_member_typedefs.md
              - Class Member Enumerations: roomba/class_member_enums.md
            - Namespaces:
              - Namespace List: roomba/namespaces.md
              - Namespace Members: roomba/namespace_members.md
          - "Functions": "roomba/functions.md"
          - "Variables": "roomba/variables.md"
          - "Macros": "roomba/macros.md"
          - "Files": "roomba/files.md"

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

plugins:
  - privacy
  - open-in-new-tab
  - mkdoxy:
      projects:
        roomba:
          src-dirs: components/roomba
          full-doc: True 
          doxy-cfg: # standard doxygen configuration (key: value)
            FILE_PATTERNS: "*.cpp *.h*" # specify file patterns to filter out
            RECURSIVE: True # recursive search in source directories
            HAVE_DOT: YES


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/retsamedoc/esphome-components
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/retsamedoc
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/retsamedoc
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/retsamedoc            
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ZacharySchimke/
  version: !ENV ${DOCS_VERSION}
